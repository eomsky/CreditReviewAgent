<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>기업여신 AI 심사지원</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<main class="app-shell">
  <section class="workbench">
    <article class="opinion-panel" aria-label="심사의견">
      <header class="opinion-head">
        <div>
          <span class="eyebrow">CREDIT REVIEW</span>
          <h1>심사의견</h1>
          <p id="opinionUpdated">정보계 자료와 현재 대화를 반영한 초기 의견</p>
        </div>
        <div class="opinion-actions">
          <nav class="version-nav" aria-label="심사의견 버전">
            <button id="previousOpinionVersion" type="button" disabled>‹ V0</button>
            <strong id="currentOpinionVersion">V1 · 최신</strong>
            <button id="nextOpinionVersion" type="button" disabled>V2 ›</button>
          </nav>
          <button id="copyOpinion" type="button">복사</button>
          <button id="saveOpinion" type="button">저장</button>
        </div>
      </header>
      <div id="opinionProgress" class="opinion-progress hidden" role="status">
        <span class="spinner"></span><b>심사의견을 업데이트하고 있습니다</b><small id="opinionProgressText">대화와 근거자료를 분석하는 중…</small>
      </div>
      <section id="opinionContent" class="opinion" aria-live="polite"></section>
    </article>

    <aside class="chat-panel" aria-label="AI 심사 대화">
      <header class="chat-head">
        <div><h2>AI 심사 대화</h2><p><i></i> 심사 에이전트 연결됨</p></div>
        <button id="dataStatusButton" type="button">입력 데이터 현황 <span id="dataCountBadge">12</span></button>
      </header>
      <section id="conversation" class="conversation" aria-live="polite">
        <article class="assistant"><span class="avatar">AI</span><div><p>정보계 자료와 초기 심사의견을 확인했습니다. 추가 정보나 검토 방향을 말씀해 주세요.</p></div></article>
      </section>
      <div id="pendingFiles" class="pending-files"></div>
      <div class="apply-row">
        <span id="applyHint">대화 내용은 확인 후 심사의견에 반영됩니다.</span>
        <button id="updateOpinion" type="button">현재까지 내용 반영</button>
      </div>
      <form id="chatForm" class="composer">
        <input id="chatFile" type="file" multiple hidden accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.csv,.txt">
        <button type="button" id="chatAttach" aria-label="파일 첨부">＋</button>
        <textarea id="messageInput" rows="1" placeholder="심사 내용에 대해 질문하거나 자료를 추가하세요"></textarea>
        <button id="sendButton" class="send" aria-label="전송">↑</button>
        <small>AI의 분석 결과는 최종 판단 전 원천자료와 대조해 주세요.</small>
      </form>
    </aside>
  </section>
</main>

<dialog id="dataExplorerDialog" class="data-dialog">
  <section class="data-explorer">
    <header>
      <div><span class="eyebrow">DATA EXPLORER</span><h2>입력 데이터 현황</h2><p>심사에 연결된 정보계 원장과 사용자 업로드 자료입니다.</p></div>
      <button id="closeDataExplorer" type="button" aria-label="닫기">×</button>
    </header>
    <div class="explorer-tools">
      <label>⌕ <input id="dataSearch" type="search" placeholder="이름, 유형, 상태 검색"></label>
      <span id="dataSummary"></span>
    </div>
    <div class="explorer-body">
      <div class="source-list">
        <table>
          <thead><tr><th>No</th><th><button data-sort="name">이름 <i></i></button></th><th><button data-sort="type">유형 <i></i></button></th><th><button data-sort="status">상태 <i></i></button></th></tr></thead>
          <tbody id="dataSourceBody"></tbody>
        </table>
      </div>
      <section id="sourcePreview" class="source-preview"></section>
    </div>
  </section>
</dialog>

<script src="/static/app.js?v=review-workbench-1" defer></script>
</body>
</html>
