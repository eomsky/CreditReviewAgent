<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 여신심사 챗봇</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">AI</span><div><strong>AI 여신심사 챗봇</strong><small>CreditReviewAgent</small></div></div>
      <button class="primary wide" id="newCase">＋ 새 심사 시작</button>
      <div class="section-title">심사건</div>
      <label class="search"><span>⌕</span><input id="caseSearch" placeholder="심사건 검색"></label>
      <div class="filters" id="caseFilters"><button class="active" data-status="">전체</button><button data-status="IN_PROGRESS">진행중</button><button data-status="COMPLETED">완료</button></div>
      <nav class="case-list" id="caseList"></nav>
      <div class="side-links"><button>◈ 공통 지식 관리</button><button>▧ 템플릿 관리</button><button>▤ 보고서 목록</button><button>⚙ 설정</button></div>
    </aside>

    <section class="workspace">
      <header class="topbar">
        <button class="case-selector" id="caseSelector"><span>▦</span><span><strong id="selectorTitle">심사건 선택</strong><small id="selectorId">-</small></span><span>⌄</span></button>
        <div class="top-actions"><button id="traceToggle">⋮ 생성과정 보기</button><button id="documentToggle">▣ 참고자료 <b id="documentCount">0</b></button></div>
        <div class="profile"><span class="profile-avatar">●</span><span><strong>김심사</strong><small>여신심사부</small></span></div>
      </header>

      <div class="content-grid" id="contentGrid">
        <main class="chat-panel">
          <section class="case-header"><div><h1 id="caseTitle">심사건을 선택하세요</h1><p id="caseMeta">새 심사를 시작하거나 왼쪽 목록에서 선택하세요.</p></div><span class="badge" id="caseStatus">대기</span></section>
          <section class="conversation" id="conversation" aria-live="polite">
            <div class="empty-state"><div class="bot">AI</div><h2>여신심사를 시작해 보세요</h2><p>심사건 자료와 공통 지식을 함께 조회해 근거 기반 답변을 제공합니다.</p></div>
          </section>
          <section class="composer-wrap"><div class="pending-files" id="pendingFiles"></div><form class="composer" id="chatForm"><input id="chatFile" type="file" multiple hidden><button type="button" id="chatAttach" class="attach">⌕</button><textarea id="messageInput" rows="1" placeholder="메시지를 입력하세요..."></textarea><button class="send" id="sendButton">➤ 전송</button></form><small>Enter로 전송, Shift+Enter로 줄바꿈</small></section>
        </main>

        <aside class="trace-panel hidden" id="tracePanel"><div class="panel-title"><div><h2>생성과정</h2><p>Generator · Validator 실행 이력</p></div><button data-close="trace">×</button></div><div class="timeline" id="timeline"></div></aside>
        <aside class="documents-panel" id="documentsPanel"><div class="panel-title"><h2>참고자료</h2><button data-close="documents">×</button></div><label class="dropzone" id="dropzone"><input id="documentInput" type="file" multiple hidden accept=".pdf,.docx,.xlsx,.xlsm,.csv,.txt,.md,.json"><span class="upload-icon">⇧</span><strong>파일을 드래그하거나 클릭하여 업로드</strong><small>PDF, DOCX, XLSX, TXT (최대 25MB)</small></label><p class="docs-label">현재 심사건에 업로드된 자료</p><div class="document-list" id="documentList"></div><button class="manage">▣ 전체 자료 관리</button></aside>
      </div>
    </section>
  </div>

  <dialog id="caseDialog"><form method="dialog" id="caseForm"><h2>새 심사 시작</h2><label>기업명<input name="company_name" required placeholder="예: A기업"></label><label>심사 유형<select name="review_type"><option>정기심사</option><option>신규 여신</option><option>한도 증액</option></select></label><label>심사건 제목<input name="title" required placeholder="예: A기업 / 2026 정기심사"></label><div class="dialog-actions"><button value="cancel">취소</button><button class="primary" value="default" id="createCaseButton">생성</button></div></form></dialog>
  <script src="/static/app.js" defer></script>
</body>
</html>
